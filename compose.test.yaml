services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raising_test
      POSTGRES_USER: raising
      POSTGRES_PASSWORD: raising_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raising -d raising_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
